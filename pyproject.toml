[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-press"
version = "0.1.0"
description = "High-fidelity raster to SVG vectoriser (shared boundary graph + VTracer backend)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-image>=0.22",
  "pillow>=10",
  "vtracer>=0.6.11",
  "resvg_py>=0.2",
]

[project.optional-dependencies]
eval = ["PyYAML>=6", "pytest>=8", "pyarrow>=15"]
# shapely wheels bundle GEOS (LGPL-2.1, dynamically linked) -> optional, see LICENSES.md
geometry = ["shapely>=2.0"]

[project.scripts]
vectorize = "vectorizer.cli:main"

[tool.setuptools]
packages = ["vectorizer", "vectorizer.pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
